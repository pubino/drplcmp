name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node.js 24 runner ahead of the 2026-06-02 hard cutover so the
# JavaScript-based actions (actions/checkout, actions/setup-python) keep
# running cleanly without deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-native:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest -v tests/

  test-docker:
    name: pytest in Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -t drplcmp-tests:ci .
      - name: Run tests in container
        run: docker run --rm drplcmp-tests:ci
